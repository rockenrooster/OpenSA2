name: Feature or build improvement
description: Propose a focused change to the port, tools, or documentation.
title: "[Request] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [current status](https://github.com/kittycache9/OpenSA2/blob/main/docs/status.md) before requesting platform support or a playable download. Development results do not imply full-game parity.
  - type: checkboxes
    id: owns_game
    attributes:
      label: Game ownership
      description: OpenSA2 needs your own copy of the 2012 PC release of Sonic Adventure 2, as Steam sells and installs it.
      options:
        - label: I own Sonic Adventure 2 on Steam. I understand that the project does not help with installing a copy I do not own, or a modified, repacked, or downloaded copy.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the task or behavior that the current project does not support.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you want and which platform or component needs it.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How to check the result
      description: Suggest a reproduction, synthetic test, or comparison that would show the change works.
