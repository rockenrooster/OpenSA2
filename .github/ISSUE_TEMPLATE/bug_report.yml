name: Bug report
description: Report a reproducible failure in a development build or source tool.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Review the [known limitations](https://github.com/kittycache9/OpenSA2/blob/main/docs/status.md) first. This repository is an experimental source preview.
        Share text diagnostics and reproduction steps. Do not attach game files, generated game code, or captures that contain game data. Remove personal paths and identifiers from logs.
  - type: checkboxes
    id: owns_game
    attributes:
      label: Game ownership
      description: OpenSA2 needs your own copy of the 2012 PC release of Sonic Adventure 2, as Steam sells and installs it.
      options:
        - label: I own Sonic Adventure 2 on Steam. I understand that the project does not help with installing a copy I do not own, or a modified, repacked, or downloaded copy.
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86-64
        - Windows x86-64
        - Android arm64
        - Linux arm64
        - Other or source tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Revision or build version
      description: The release you installed (Android shows it in the app's title, for example OpenSA2 0.1.0-alpha.2), or the revision you built.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Hardware and software
      description: Include the OS, CPU, GPU, driver, and renderer. For Android, include the device and Android version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the game mode, stage or event, input device, and the shortest sequence that reproduces the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: crash_report
    attributes:
      label: Crash report
      description: On Android, open OpenSA2 after the game stops and tap Report on GitHub or Copy report, then paste the report here. It includes the device, the GPU, and the game's last log lines.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant text diagnostics
      description: Paste the error or missing-block address. Keep the output short and remove personal information.
      render: text
  - type: checkboxes
    id: source_only
    attributes:
      label: Repository boundary
      options:
        - label: This report contains no game files, translated game code, or captures with game data.
          required: true
